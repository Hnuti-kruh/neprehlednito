services:
  neprehlednito-web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE to the published GHCR image with its sha tag}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      proxy:
        aliases:
          - neprehlednito-web
    ports:
      - "127.0.0.1:18080:8080"
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
